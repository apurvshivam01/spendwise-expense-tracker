services:
  - type: web
    name: spendwise-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: CLIENT_URL
        value: https://trackwithspendwise.vercel.app
      - key: JWT_SECRET
        generateValue: true
